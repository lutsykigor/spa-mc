[project]
name = "spa-mc"
version = "0.1.0"
description = "Single Process Adaptive Multi-Core: one asyncio event loop per core, each in its own subinterpreter, with an adaptive concurrency valve."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spa_mc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
faulthandler_timeout = 60
markers = [
    "linux: needs Linux-only kernel features (sched_setaffinity, balanced SO_REUSEPORT)",
    "timing: asserts on wall-clock speedups; meaningful only on an otherwise idle machine",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.format]
quote-style = "single"
